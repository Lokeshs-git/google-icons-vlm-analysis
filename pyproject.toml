[project]
name = "workspace-icons-vlm-study"
version = "0.1.0"
description = "Embedding-space separation of Google Workspace icons before and after the May 2026 redesign."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "torch>=2.3",
    "open-clip-torch>=2.24",
    "transformers>=4.42",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "umap-learn>=0.5.6",
    "click>=8.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
